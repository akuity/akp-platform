# Discovers apps/*/argocd/ and creates one Argo CD Application per app that
# syncs that app's AppProject and ApplicationSets to the Argo CD control plane.
# Adding a new app directory under apps/ is all that's needed — no edits here.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: argocd-apps
  namespace: argocd
spec:
  generators:
  - git:
      repoURL: https://github.com/example-org/akp-platform.git
      revision: HEAD
      directories:
      - path: apps/*/argocd
  template:
    metadata:
      name: 'argocd-{{path[1]}}'
    spec:
      # Uses the dedicated akp-bootstrap project (bootstrap/akp-bootstrap-project.yaml)
      # to avoid a chicken-and-egg: each app's AppProject lives inside the
      # argocd/ path this Application syncs, so the project can't exist
      # before the Application is created. akp-bootstrap is created once,
      # up front, specifically to break that cycle — never assume `default`
      # is usable (see akp-bootstrap-project.yaml for why).
      project: akp-bootstrap
      source:
        repoURL: https://github.com/example-org/akp-platform.git
        targetRevision: HEAD
        path: '{{path}}'
        directory:
          recurse: true
      destination:
        name: in-cluster
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
