# Root app-of-apps. Apply bootstrap/akp-bootstrap-project.yaml FIRST
# (`argocd proj create -f bootstrap/akp-bootstrap-project.yaml`), then
# apply this ONCE (`argocd app create -f bootstrap/platform-aoa.yaml`) and
# everything else in this repo — every app's Argo CD and Kargo resources —
# is discovered and deployed automatically by the ApplicationSets in this
# directory. Onboarding a new app never requires touching bootstrap/ again.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-aoa
  namespace: argocd
spec:
  project: akp-bootstrap
  source:
    repoURL: https://github.com/example-org/akp-platform.git
    targetRevision: HEAD
    path: bootstrap
  destination:
    name: in-cluster
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
